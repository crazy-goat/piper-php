name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Composer fetches dists from codeload.github.com, which rate-limits unauthenticated
  # requests. The automatic token needs no setup and raises the limit.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main
    with:
      docs-regex: '^(.*\.md|docs/.*|LICENSE.*|\.github/ISSUE_TEMPLATE/.*|\.github/pull_request_template\.md|\.gitignore)$'

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  # Setup only; every check lives in bin/lint.sh (composer validate/audit, php-cs-fixer,
  # PHPStan, Rector, shellcheck). One PHP version is enough: these tools do not vary across runtimes.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ffi
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Pinned: the version the image ships would change under us without a commit here.
      - name: Install shellcheck
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" shellcheck-v0.11.0/shellcheck
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellcheck" --version

      - name: Lint
        run: bin/lint.sh

  test-unit:
    name: unit (php ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json requires php >=8.2
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  build-piper-glibc:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config python3-pip
        pip3 install "cmake>=3.26"
        cmake --version
        
    - name: Build Piper
      run: make build-libpiper
      
    - name: Strip debug symbols
      run: |
        strip --strip-debug piper1-gpl/libpiper/build/libpiper.so
        find piper1-gpl/libpiper/build/piper1-gpl/libpiper/install/lib -name "libonnxruntime.so.*" -type f -exec strip --strip-debug {} + 2>/dev/null || true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: piper-build-glibc
        path: |
          piper1-gpl/libpiper/build/libpiper.so
          piper1-gpl/libpiper/build/piper1-gpl/libpiper/install/lib/libonnxruntime.so
          piper1-gpl/libpiper/build/piper1-gpl/libpiper/install/share/espeak-ng-data
        retention-days: 7



  build-piper-musl:
    name: build-piper-musl
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: alpine:3.23
    
    steps:
    - name: Install git and build dependencies
      run: |
        apk add --no-cache cmake build-base git linux-headers pkgconfig onnxruntime-dev
        
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        
    - name: Build Piper
      run: make build-libpiper

  test-integration:
    runs-on: ubuntu-latest
    needs: [changes, build-piper-glibc]
    if: needs.changes.outputs.code == 'true'
    
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: ffi
        
    - name: Install dependencies
      run: composer install --no-interaction --no-progress
        
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: piper-build-glibc
        path: piper1-gpl/libpiper/build
        
    - name: Copy libraries to libs/
      run: |
        mkdir -p libs
        cp piper1-gpl/libpiper/build/libpiper.so libs/
        cp piper1-gpl/libpiper/build/piper1-gpl/libpiper/install/lib/libonnxruntime.so* libs/
        cp -r piper1-gpl/libpiper/build/piper1-gpl/libpiper/install/share/espeak-ng-data libs/
        
    - name: Cache voice model
      uses: actions/cache@v6
      with:
        path: models/
        key: voice-model-en-us-lessac-low-v1
        
    - name: Download test voice model
      run: make test-model
      
    - name: Run integration tests
      run: vendor/bin/phpunit --group integration

  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, test-unit, build-piper-glibc, build-piper-musl, test-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
